<svg width="1600" height="2000" viewBox="0 0 1600 2000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="2000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.52" stop-color="#0B1720"/>
      <stop offset="1" stop-color="#15120D"/>
    </linearGradient>
    <linearGradient id="core" x1="520" y1="640" x2="1080" y2="1220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DE7FF"/>
      <stop offset="0.52" stop-color="#2BB8D6"/>
      <stop offset="1" stop-color="#F2B84B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 940) rotate(90) scale(650 650)">
      <stop offset="0" stop-color="#53D8F8" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#53D8F8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#53D8F8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 800 136px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0; fill: #F8FBFF; }
      .subtitle { font: 500 42px "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0; fill: #BFD2DC; }
      .footer { font: 500 34px "Inter", "Helvetica Neue", Arial, sans-serif; letter-spacing: 3px; fill: #8FA7B3; }
      .nodeText { font: 600 28px "Inter", "PingFang SC", sans-serif; letter-spacing: 0; fill: #DDF6FF; }
      .smallText { font: 500 22px "PingFang SC", "Inter", sans-serif; letter-spacing: 0; fill: #91A9B5; }
    </style>
  </defs>

  <rect width="1600" height="2000" fill="url(#bg)"/>
  <rect width="1600" height="2000" fill="url(#glow)"/>

